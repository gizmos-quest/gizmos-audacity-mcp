name: Release

on:
  workflow_dispatch:
    inputs:
      level:
        description: Version level (initial publishes the current upcoming version)
        type: choice
        required: true
        default: initial
        options: [initial, patch, minor, major]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'gizmos-quest/gizmos-audacity-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # This job pushes its generated release commit and tag after npm publication.
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: current
          package-manager-cache: false
      - run: npm ci
      - run: npm run release:prepare
        env:
          RELEASE_LEVEL: ${{ inputs.level }}
      - run: npm run check:workflows
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run check:package
      - run: npm audit --audit-level=high
      - run: npm run release:publish
        env:
          GH_TOKEN: ${{ github.token }}
