name: Release

on:
  workflow_dispatch:
    inputs:
      level:
        description: Version level (initial publishes the current upcoming version)
        type: choice
        required: true
        default: initial
        options: [initial, patch, minor, major]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'gizmos-quest/gizmos-audacity-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # This job pushes its generated release commit and tag after npm publication.
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: current
          package-manager-cache: false
      - run: npm ci
      - run: npm run release:prepare
        env:
          RELEASE_LEVEL: ${{ inputs.level }}
      - run: npm run check:workflows
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run check:package
      - run: npm audit --audit-level=high
      - run: npm audit signatures
      - run: npm run release:publish
        env:
          GH_TOKEN: ${{ github.token }}
